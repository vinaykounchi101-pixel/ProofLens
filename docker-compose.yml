version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: prooflens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prooflens
      POSTGRES_PASSWORD: prooflens_password
      POSTGRES_DB: prooflens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prooflens -d prooflens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
